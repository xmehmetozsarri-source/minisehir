const _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new THREE.Vector3(), _c = new THREE.Color();

let down = null;
canvas.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY, t: performance.now()}; });
canvas.addEventListener('pointerup', e => {
  if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (dx * dx + dy * dy < 120 && performance.now() - down.t < 450) tap(e.clientX, e.clientY);
  down = null;
});
const _p = new THREE.Vector3();
function scr(x, y, z){ _p.set(x, y, z).project(camera); if (_p.z > 1) return null; return [(_p.x + 1) / 2 * innerWidth, (1 - _p.y) / 2 * innerHeight]; }
function tap(x, y){
  let best = -1, bd = 46 * 46;
  people.list.forEach((p, i) => { for (const h of [0.9, 1.9]){ const s = scr(p.pos.x, h * p.s, p.pos.z); if (!s) continue; const d = (s[0] - x) ** 2 + (s[1] - y) ** 2; if (d < bd){ bd = d; best = i; } } });
  if (best >= 0){ react(best); return; }
  if (!inside){ let bb = null, bd2 = 80 * 80; BUILDINGS.forEach(b => { const s2 = scr(b.ox, 3, b.oz); if (!s2) return; const d = (s2[0] - x) ** 2 + (s2[1] - y) ** 2; if (d < bd2){ bd2 = d; bb = b; } }); if (bb){ showBuilding(bb.name); return; } }
  if (inside) return;
  let lb = null; bd = 70 * 70;
  lots.forEach(L => { const s = scr(L.x, 2.5, L.z); if (!s) return; const d = (s[0] - x) ** 2 + (s[1] - y) ** 2; if (d < bd){ bd = d; lb = L; } });
  if (lb && lb.owner !== undefined){ const i = people.list.findIndex(p => p.r && p.r.idx === lb.owner); if (i >= 0){ react(i); return; } }

const skyDay = new THREE.Color(0xf3ead8), skyNight = new THREE.Color(0x1d2236), skyDusk = new THREE.Color(0xf2b58c);
let nightK = 0; const isNight = () => nightK > 0.5;
function updateSky(){
  const now = new Date(); const ist = new Date(now.toLocaleString('en-US', {timeZone: 'Europe/Istanbul'}));
  const tm = SETTINGS.time_mode; const h = params.get('saat') ? parseFloat(params.get('saat')) : tm === 'day' ? 13 : tm === 'night' ? 22 : ist.getHours() + ist.getMinutes() / 60;
  $('clock').textContent = String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0');
  $('day').textContent = 'Gün ' + Math.max(1, Math.floor((now - START) / 864e5) + 1);
  const ang = (h - 6) / 12 * Math.PI; const up = Math.sin(ang);
  sun.position.set(Math.cos(ang) * 160, Math.max(20, up * 180), -90); sun.target.position.set(0, 0, 0);
  const day = THREE.MathUtils.clamp(up * 2.2 + 0.3, 0, 1); const dusk = THREE.MathUtils.clamp(1 - Math.abs(up) * 4, 0, 1) * (h > 4 && h < 21 ? 1 : 0);
  const sky = skyNight.clone().lerp(skyDay, day).lerp(skyDusk, dusk * 0.55);
  scene.background = sky; scene.fog.color.copy(sky);
  sun.intensity = 0.25 + 2.0 * day; hemi.intensity = 0.4 + 0.75 * day;
  nightK = 1 - day;
  lampMat.color.setHex(day < 0.5 ? 0xffd27a : 0xf4efe2);
  winLit.emissive.setRGB(1.0, 0.72, 0.38).multiplyScalar(Math.max(0, nightK - 0.3) * 1.2);
  winDark.emissive.setRGB(0.1, 0.12, 0.2).multiplyScalar(nightK);
  renderer.shadowMap.needsUpdate = true;
  if (inside){ scene.background = new THREE.Color(0x2b2533); scene.fog.color.set(0x2b2533); hemi.intensity = 1.15; sun.intensity = 1.5; }
}

function flyTo(x, z, dist = 34, h = 26, ms = 1600, ang = 0){
  const from = {p: camera.position.clone(), t: controls.target.clone()};
  const ox = dist * 0.55, oz = dist, c = Math.cos(ang), sn = Math.sin(ang);
  const to = {t: new THREE.Vector3(x, 0, z), p: new THREE.Vector3(x + ox * c + oz * sn, h, z - ox * sn + oz * c)};
  fly = {from, to, t0: performance.now(), ms};
}
function updateFly(){

  if (k >= 1) fly = null;
}

  } catch(e){ toast('Bağlantı sorunu'); }
}
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 1 ? 'şimdi' : m < 60 ? m + ' dk önce' : m < 1440 ? Math.round(m / 60) + ' saat önce' : Math.round(m / 1440) + ' gün önce'; };
async function showNotifs(){
  if (!sb || !ME.u) return;
  const {data} = await sb.from('events').select('from_u,kind,created_at,seen').eq('to_u', ME.u).order('created_at', {ascending: false}).limit(30);
  const items = (data || []).map(e => `<li>${e.seen ? '' : '🟠 '}${e.kind === 'knock' ? `<b>@${esc(e.from_u)}</b> kapını çaldı 🚪` : esc(e.kind)}<br><small>${ago(e.created_at)}</small></li>`).join('');
  openCard(`<h2>🔔 Bildirimler</h2>${items ? `<ul class="nl">${items}</ul>` : '<p>Henüz bildirim yok. Komşuların kapını çaldığında burada görünecek.</p>'}`);
  if ((data || []).some(e => !e.seen)){ await sb.from('events').update({seen: true}).eq('to_u', ME.u).eq('seen', false); ME.unseen = 0; updateMeUI(); }
}
function showAdminLogin(){
  openCard(`<h2>⚙️ Yönetici girişi</h2><input class="f" id="ae" type="email" autocomplete="username" placeholder="E-posta"><input class="f" id="ap" type="password" autocomplete="current-password" placeholder="Şifre">
  <div class="row"><button class="pri btn" id="alog">Giriş yap</button></div>`);
  $('alog').onclick = async () => {
    if (!(await sbP)){ toast('Sunucuya ulaşılamadı'); return; }
    const {error} = await sb.auth.signInWithPassword({email: $('ae').value.trim(), password: $('ap').value});
    if (error){ toast('Giriş olmadı: e-posta ya da şifre yanlış'); return; }
    await refreshMe(); if (ME.admin) showAdmin(); else toast('Bu hesap yönetici değil');
  };
}
async function showAdmin(){
  const {data: rs} = await sb.from('residents').select('u,banned,claimed').order('idx');
  const all = rs || [], tm = SETTINGS.time_mode;
  openCard(`<div class="adm"><h2>⚙️ Yönetim</h2><p>Nüfus: <b>${all.filter(x => !x.banned).length}</b> · Sahiplenen: <b>${all.filter(x => x.claimed).length}</b> · Engelli: <b>${all.filter(x => x.banned).length}</b></p>
  <h3>Saat (herkes için)</h3><div class="seg"><button class="btn ${tm === 'auto' ? 'on' : ''}" data-m="auto">Otomatik</button><button class="btn ${tm === 'day' ? 'on' : ''}" data-m="day">☀️ Gündüz</button><button class="btn ${tm === 'night' ? 'on' : ''}" data-m="night">🌙 Gece</button></div>
  <h3>Yeni sakin ekle</h3><textarea class="f" id="newu" rows="3" placeholder="Kullanıcı adları: virgülle ya da alt alta"></textarea><div class="row"><button class="pri btn" id="addu">Şehre ekle</button></div>
  <h3>Sakin yönet</h3><input class="f" id="mu" placeholder="@kullanıcıadı" autocapitalize="off">
  <div class="row"><button class="sec btn" id="mgo">Evine git</button><button class="sec btn" id="mban">Engelle</button></div>
  <div class="row"><button class="sec btn" id="munban">Engeli kaldır</button><button class="sec btn" id="mreset">Sahipliği sıfırla</button></div>
  <div class="row"><button class="sec btn" id="alogout">Çıkış</button></div></div>`);
  document.querySelectorAll('.seg button').forEach(b => b.onclick = async () => {
    const m = b.dataset.m; const {error} = await sb.from('settings').upsert({key: 'time_mode', value: m});
    if (error){ toast('Kaydedilemedi'); return; } SETTINGS.time_mode = m; updateSky(); toast('Saat ayarı herkes için güncellendi'); showAdmin();
  });
  $('addu').onclick = async () => {
    const list = [...new Set($('newu').value.split(/[\s,;]+/).map(norm).filter(u => /^[a-z0-9._]{1,30}$/.test(u)))];
    if (!list.length){ toast('Kullanıcı adı yaz'); return; }
    const {error} = await sb.from('residents').upsert(list.map(u => ({u})), {onConflict: 'u', ignoreDuplicates: true});
    toast(error ? 'Eklenemedi' : `${list.length} sakin eklendi. Evleri sayfa yenilenince çıkar.`, 3200); if (!error) $('newu').value = '';
  };
  const mu = () => norm($('mu').value);
  const upd = async (vals, msg) => { const u = mu(); if (!u) return; const {error} = await sb.from('residents').update(vals).eq('u', u); toast(error ? 'Olmadı' : msg); };
  $('mgo').onclick = () => { const u = mu(); if (u){ $('card').classList.remove('show'); findUser(u); } };
  $('mban').onclick = async () => { const u = mu(); if (!u) return; await sb.from('claims').delete().eq('u', u); await upd({banned: true, claimed: false}, `@${u} engellendi, evi boşaltıldı`); };
  $('munban').onclick = () => upd({banned: false}, 'Engel kaldırıldı');
  $('mreset').onclick = async () => { const u = mu(); if (!u) return; const {error} = await sb.from('claims').delete().eq('u', u); await upd({claimed: false}, error ? 'Olmadı' : `@${u} sahipliği sıfırlandı`); };
  $('alogout').onclick = async () => { await sb.auth.signOut(); ME = {u: null, admin: false, unseen: 0}; updateMeUI(); $('card').classList.remove('show'); toast('Çıkış yapıldı'); };
}
async function initServer(){
  if (!(await sbP)) return;
  try { const {data} = await sb.from('settings').select('key,value'); (data || []).forEach(r => SETTINGS[r.key] = r.value); updateSky(); } catch(e){}
  try { const {data: {session}} = await sb.auth.getSession(); if (session) await refreshMe(); } catch(e){}
  if (params.has('yonetici') && !ME.admin) showAdminLogin();
  setInterval(() => { if (ME.u && !document.hidden) refreshMe(); }, 60000);
}
$('cx').onclick = () => $('card').classList.remove('show');
$('go').onclick = () => findUser($('q').value);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter'){ $('q').blur(); findUser($('q').value); } });
$('regbtn').onclick = () => $('menu').classList.toggle('open');
function buildMenu(){
  const m = $('menu');
  Object.entries(landmarks).forEach(([k, [x, z]]) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = k; b.onclick = () => { m.classList.remove('open'); flyTo(x, z, 34, 24); }; m.appendChild(b); });
  const all = document.createElement('button'); all.className = 'btn'; all.textContent = 'Tüm mahalle'; all.onclick = () => { m.classList.remove('open'); flyTo(0, 10, 170, 150, 1800); }; m.appendChild(all);
}

// ---------- sinema modu (video cekimi icin) ----------
window.cine = { showAdmin, showClaim, flyTo, findUser, react, enterRoom, exitRoom, showBuilding, scene, camera, controls, people, setPos(px, py, pz, tx, ty, tz){ camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); controls.update(); } };

// ---------- dongu ----------
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 48 : 38; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
camera.position.set(110, 150, 230); controls.target.set(0, 0, 10);
buildMenu();
await loadResidents();
updateSky(); setInterval(updateSky, 30000); initServer();
let last = performance.now(), fpsN = 0, fpsT = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updateFly(); controls.update(); updatePeople(dt, now);
  if ((lblT += dt) > 0.25){ lblT = 0; updateLabels(); }
  roomChatter(dt);
  renderer.render(scene, camera); requestAnimationFrame(loop);
  // yavas cihazda cozunurlugu otomatik dusur
  if (!CINE){ fpsN++; fpsT += dt; if (fpsT > 2.5){ const fps = fpsN / fpsT; fpsN = 0; fpsT = 0; if (fps < 32 && PR > 1){ PR = Math.max(1, PR - 0.25); renderer.setPixelRatio(PR); resize(); } } }
}
requestAnimationFrame(loop);
setTimeout(() => { $('load').classList.add('hide'); if (!params.get('u') && !CINE) flyTo(0, -6, 95, 80, 2600); }, 400);
</script>
