function startArrival(){

  try { localStorage.setItem('ms_seen', String(maxIdx)); } catch(e){}

  if (seen === null && !forced) return;
  const news = people.list.filter(p => p.r && !p.founder && (forced ? p.r.idx >= maxIdx - 3 : p.r.idx > +seen)).slice(-6); if (!news.length) return;
  const {cx, cz, W} = STATION, front = W(0, -13)[1], Lz = LINES.reduce((a, b) => Math.abs(b - front) < Math.abs(a - front) ? b : a), PT = 1.3, Q = (lx, lz, y) => { const [a, b] = W(lx, lz); return {x: a, z: b, y}; };
  news.forEach((p, k) => {
    const sx = k % 2 ? 6 : -6, hx = p.home.x, hz = p.home.z;
    const Xv = LINES.reduce((a, b) => Math.abs(b - hx) < Math.abs(a - hx) ? b : a), sg = Math.sign(hx - Xv) || 1, ex = Xv + sg * 3.6, ez = Lz + Math.sign(cz - Lz) * 3.6;
    const st0 = Q(sx, -8.7); p.pos.set(st0.x, 0, st0.z); p.yb = 0.3; p.inG = false; p.arriving = true; p.speed = 2.3; p.wait = k * 1.6; p.sit = null;
    p.q = [Q(sx, -4.6, PT), Q(0, -4.6, PT), Q(0, -10.9, PT), Q(0, -12.9, 0.3), {x: cx, z: ez, y: 0.3}, {x: ex, z: ez, y: 0.3}, {x: ex, z: hz, y: 0.3}, {x: hx, z: hz, y: 0.3}];
    newTarget(p);
  });
  setTimeout(() => toast(`🚆 ${news.length} yeni komşu trenle geldi! Gar'a bak`, 4000), 2500);
}

  const all = document.createElement('button'); all.className = 'btn'; all.textContent = 'Tüm mahalle'; all.onclick = () => { m.classList.remove('open'); flyTo(0, 10, 170, 150, 1800); }; m.appendChild(all);
}

// ---------- sinema modu (video cekimi icin) ----------
window.cine = { showGallery, showMenu, sitAt, GALLERY, ROOMS, showEditor, showShop, startWork, enterHouse, showTop, startArrival, houseTag, buildDeco, PROF, STATION, VEH, lots, residents: () => residents, setMe(o){ ME = o.ME || ME; MYP = o.MYP || MYP; updateMeUI(); updateWorkbar(); }, showAdmin, showClaim, flyTo, findUser, react, enterRoom, exitRoom, showBuilding, scene, camera, controls, people, setPos(px, py, pz, tx, ty, tz){ camera.position.set(px, py, pz); controls.target.set(tx, ty, tz); controls.update(); } };

// ---------- dongu ----------
function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.8 ? 48 : 38; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
camera.position.set(110, 150, 230); controls.target.set(0, 0, 10);
buildMenu();
await loadResidents();
startArrival();
updateSky(); setInterval(updateSky, 30000); setInterval(drawClock, 30000); initServer().then(loadProfiles);
let last = performance.now(), fpsN = 0, fpsT = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  updateFly(); controls.update(); updatePeople(dt, now);
  const ts = now / 1000; updateTraffic(dt, ts); for (const m of SHOWCARS) m.rotation.y += dt * 0.35; updateLights(ts); updateFlags(ts);
  if (htag){ htag.t -= dt; htag.s.material.opacity = Math.min(1, htag.t); if (htag.t <= 0){ scene.remove(htag.s); htag = null; } }
  if ((lblT += dt) > 0.25){ lblT = 0; updateLabels(); }
  roomChatter(dt);
  renderer.render(scene, camera); requestAnimationFrame(loop);
  // yavas cihazda cozunurlugu otomatik dusur
  if (!CINE){ fpsN++; fpsT += dt; if (fpsT > 2.5){ const fps = fpsN / fpsT; fpsN = 0; fpsT = 0; if (fps < 32 && PR > 1){ PR = Math.max(1, PR - 0.25); renderer.setPixelRatio(PR); resize(); } } }
}
requestAnimationFrame(loop);
setTimeout(() => { $('load').classList.add('hide'); if (!params.get('u') && !CINE) flyTo(0, -6, 95, 80, 2600); }, 400);
</script>
